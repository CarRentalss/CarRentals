# Lokalne uruchomienie bez LocalDB: SQL Server w kontenerze + nasze API.
#   docker compose up --build
# Swagger: http://localhost:5080/swagger
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-Local_dev_Passw0rd!}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  carrental-api:
    build:
      context: .
      dockerfile: backend/CarRental.Api/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CarRentalDb: "Server=sql,1433;Database=CarRentalDb;User Id=sa;Password=${SQL_SA_PASSWORD:-Local_dev_Passw0rd!};TrustServerCertificate=True"
    ports:
      - "5080:8080"
